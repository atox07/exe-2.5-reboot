name: Build Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Ti permette di avviarlo manualmente da un tasto

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Haxe
      uses: krdlab/setup-haxe@v1
      with:
        haxe-version: 4.2.5 # Psych 0.6.3 gira bene con questa versione

    - name: Setup Haxelib & Dependencies
      run: |
        haxelib setup C:\haxelib
        haxelib install lime 7.9.0 --quiet
        haxelib install openfl 9.2.2 --quiet
        haxelib install flixel 4.11.0 --quiet
        haxelib install flixel-addons 2.11.0 --quiet
        haxelib install flixel-ui 2.5.0 --quiet
        haxelib install hxcpp 4.2.1 --quiet
        haxelib install hscript --quiet
        haxelib install discord_rpc --quiet
        haxelib install linc_luajit --quiet
        # Nota: se mancano altre lib, aggiungile qui

    - name: Build with Lime
      run: |
        haxelib run lime build windows -D officialBuild
      env:
        HAXELIB_PATH: C:\haxelib

    - name: Upload Build
      uses: actions/upload-artifact@v4
      with:
        name: Sonic-Exe-Build
        path: export/release/windows/bin/
