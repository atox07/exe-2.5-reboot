name: Build Mod Manuale

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Haxe
      uses: krdlab/setup-haxe@v1
      with:
        haxe-version: 4.2.5

    # bash => si ferma al primo comando che fallisce (PowerShell no)
    - name: Setup Haxelib & Dependencies
      shell: bash
      run: |
        haxelib setup C:/haxelib
        haxelib install lime 7.9.0 --quiet
        haxelib install openfl 9.1.0 --quiet
        haxelib install flixel 4.11.0 --quiet
        haxelib install flixel-addons 2.11.0 --quiet
        haxelib install flixel-ui 2.4.0 --quiet
        haxelib install hxcpp 4.2.1 --quiet
        haxelib install hscript 2.4.0 --quiet
        haxelib git linc_luajit https://github.com/nebulazorua/linc_luajit
        haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc
        haxelib list

    - name: Build with Lime
      shell: bash
      run: |
        haxelib run lime build windows
      env:
        HAXELIB_PATH: C:/haxelib

    - name: Upload Build
      uses: actions/upload-artifact@v4
      with:
        name: Sonic-Exe-Build
        path: export/release/windows/bin/
        if-no-files-found: error
